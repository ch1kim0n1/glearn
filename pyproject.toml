[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glearn-cli"
version = "0.5.0"
description = "Meta-learning and reflective layer for the G-Stack (Node.js CLI, installable via pip)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "GLearn contributors" }]
keywords = [
    "glearn",
    "meta-learning",
    "g-stack",
    "cli",
    "pattern-mining",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: JavaScript",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/ch1kim0n1/glearn"
Homepage = "https://github.com/ch1kim0n1/glearn"
Issues = "https://github.com/ch1kim0n1/glearn/issues"

[project.scripts]
glearn = "glearn.__main__:main"

[tool.hatch.build]
# The repository .gitignore contains a non-UTF-8 byte (a Windows-1252 em dash),
# which crashes hatchling's VCS-exclusion reader. We declare file inclusion
# explicitly below, so VCS-derived ignore patterns are unnecessary.
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["python/glearn"]
# Ensure the bundled JS and its WASM sidecar (non-.py files) are shipped.
artifacts = [
    "python/glearn/_bundle/glearn.cli.js",
    "python/glearn/_bundle/tiktoken_bg.wasm",
    "python/glearn/package.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "/python/glearn",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/scripts/build_pypi.sh",
]
